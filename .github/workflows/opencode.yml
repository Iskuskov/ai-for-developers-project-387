name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# один прогон на issue: новая команда агента отменяет устаревшую
concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  opencode:
    # только команда агента, только от доверенного участника:
    # боты игнорируются, комментарии из недоверенных форков
    # не доходят до шагов с секретами
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/glm-5.3-flash
          mentions: /oc,/opencode
