name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# один прогон на issue: новая команда отменяет устаревшую.
# Комментарии ботов (в т.ч. ответ самого агента) получают уникальную
# группу, чтобы их «пустые» прогоны не отменяли рабочий прогон:
# concurrency вычисляется раньше, чем if у джоба
concurrency:
  group: ${{ github.event.comment.user.type == 'Bot' && format('opencode-bot-{0}', github.event.comment.id) || format('opencode-{0}', github.event.issue.number) }}
  cancel-in-progress: true

jobs:
  opencode:
    # только команда агента, только от доверенного участника:
    # боты игнорируются, комментарии из недоверенных форков
    # не доходят до шагов с секретами
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Budget check (до вызова модели)
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          LIMIT: ${{ vars.OPENCODE_PR_BUDGET || '3' }}
        run: |
          TITLE=$(gh api "repos/${{ github.repository }}/issues/$ISSUE" --jq .title)
          USED=$(gh api "repos/${{ github.repository }}/actions/runs?event=issue_comment&per_page=100" \
            --jq "[.workflow_runs[] | select(.name == \"opencode\" and .display_title == \"$TITLE\")] | length")
          echo "Прогонов агента по этому issue: $USED из $LIMIT"
          if [ "$USED" -ge "$LIMIT" ]; then
            SHA=$(git rev-parse HEAD)
            gh issue comment "$ISSUE" --body "limit_exhausted: бюджет запусков агента исчерпан ($USED/$LIMIT). Последний SHA: \`$SHA\`. Логи: https://${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Нужен человек."
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Toolchain (Java, Node, pnpm — для тестов агента)
        if: steps.budget.outputs.exhausted != 'true'
        uses: jdx/mise-action@v5

      - name: Run OpenCode
        id: opencode
        if: steps.budget.outputs.exhausted != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          mentions: /oc,/opencode
          # share: false — явный запрет автопубликации сессий (для публичных
          # репозиториев экшен по умолчанию шарит); решение по share — manual
          share: "false"

      - name: Report failure reason (без модели)
        if: failure() && steps.budget.outputs.exhausted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          SHA=$(git rev-parse HEAD)
          case "${{ steps.opencode.outcome }}" in
            cancelled) REASON="timeout" ;;
            failure)   REASON="agent_failed (или infra — по логам)" ;;
            *)         REASON="agent_failed" ;;
          esac
          gh issue comment "$ISSUE" --body "Автопрогон агента завершился ошибкой: \`$REASON\`. Последний SHA: \`$SHA\`. Логи: https://${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Нужен человек."
